name: Bug Report
description: Report a bug in HephaestusForge or an issue in the public Wiki.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Desktop App (Windows)
        - Studios Workbench
        - Godot 4 Integration / Play (F5)
        - Starter Packs / Asset Catalog
        - Wiki / Website
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: HephaestusForge Version
      placeholder: "e.g. v0.3.0"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment (Windows & Godot version)
      placeholder: "e.g. Windows 11 23H2, Godot 4.3"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click on ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: false
