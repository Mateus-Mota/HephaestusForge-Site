<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" fill="none">
  <defs>
    <radialGradient id="emberHalo" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#FF7A1A" stop-opacity="0.34"/>
      <stop offset="48%" stop-color="#E0450F" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0F0D0C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldBg" x1="210" y1="68" x2="210" y2="352" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#201A15"/>
      <stop offset="100%" stop-color="#120F0D"/>
    </linearGradient>
    <linearGradient id="shieldBorder" x1="210" y1="68" x2="210" y2="352" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFB25C" stop-opacity="0.7"/>
      <stop offset="45%" stop-color="#FF7A1A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4A3C2E" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="markHeat" cx="50%" cy="85%" r="75%">
      <stop offset="0" stop-color="#FFF1D0"/>
      <stop offset="0.35" stop-color="#FFB25C"/>
      <stop offset="0.7" stop-color="#FF7A1A"/>
      <stop offset="1" stop-color="#C2560C"/>
    </radialGradient>
    <linearGradient id="markFlame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB25C"/>
      <stop offset="1" stop-color="#FF7A1A"/>
    </linearGradient>
  </defs>

  <!-- Halo de brasa -->
  <circle cx="210" cy="204" r="196" fill="url(#emberHalo)"/>

  <!-- Anéis industriais concêntricos -->
  <circle cx="210" cy="210" r="176" stroke="#33291F" stroke-width="1.25" stroke-dasharray="6 8"/>
  <circle cx="210" cy="210" r="146" stroke="#4A3C2E" stroke-width="1" stroke-opacity="0.65"/>

  <!-- Marcadores cardinais -->
  <line x1="210" y1="22" x2="210" y2="38" stroke="#FF7A1A" stroke-width="2" stroke-linecap="round"/>
  <line x1="210" y1="382" x2="210" y2="398" stroke="#4A3C2E" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="210" x2="38" y2="210" stroke="#4A3C2E" stroke-width="2" stroke-linecap="round"/>
  <line x1="382" y1="210" x2="398" y2="210" stroke="#4A3C2E" stroke-width="2" stroke-linecap="round"/>

  <!-- Octógono / placa forjada central -->
  <rect x="82" y="82" width="256" height="256" rx="46" fill="url(#shieldBg)" stroke="url(#shieldBorder)" stroke-width="2.5"/>
  <rect x="94" y="94" width="232" height="232" rx="36" stroke="#33291F" stroke-width="1.2"/>

  <!-- Faíscas flutuantes -->
  <circle cx="152" cy="144" r="3" fill="#FFB25C" fill-opacity="0.85"/>
  <circle cx="272" cy="134" r="2.5" fill="#FFF1D0" fill-opacity="0.8"/>
  <circle cx="284" cy="176" r="2" fill="#FF7A1A" fill-opacity="0.75"/>
  <circle cx="136" cy="186" r="2" fill="#FF7A1A" fill-opacity="0.6"/>

  <!-- Marca da Forja viva (mesma bigorna + chama do app, public/favicon.svg) -->
  <g transform="translate(95 102) scale(3.6)" filter="url(#softGlow)">
    <path d="M10 27h34c5 0 10 3 10 7H40l-3 6h4v8H23v-8h4l-3-6h-8c-4 0-7-3-6-7z" fill="url(#markHeat)"/>
    <path d="M31 8c3 5 8 7.5 8 13a6.5 6.5 0 0 1-13 0c0-4 3.5-6.5 5-13z" fill="url(#markFlame)"/>
    <path d="M31.5 13.5c1.5 3 4 4.5 4 7.5a3.5 3.5 0 0 1-7 0c0-2.2 2-3.8 3-7.5z" fill="#FFF1D0"/>
  </g>
</svg>
